# /etc/nginx/sites-available/sorte.zeferius.com.br
# Site ISOLADO na porta 2525 - não altera nenhum outro server block existente.
server {
    listen 2525;
    listen [::]:2525;
    server_name sorte.zeferius.com.br;

    root /var/www/sortezeferius;
    index index.html;

    client_max_body_size 5m;

    access_log /var/log/nginx/sortezeferius.access.log;
    error_log  /var/log/nginx/sortezeferius.error.log;

    # Backend FastAPI (serviço systemd sortezeferius na porta interna 8025)
    location /api/ {
        proxy_pass http://127.0.0.1:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Arquivos estáticos com cache longo
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA (React Router): /admin, /pagamento/retorno etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
